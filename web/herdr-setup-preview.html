<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Herdr setup preview</title>
    <style>
      .setup-preview-toolbar {
        position: fixed;
        z-index: 1;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 16px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        font: 12px / 1.5 system-ui, sans-serif;
      }
      .setup-preview-toolbar nav {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }
      .setup-preview-toolbar a { color: var(--accent); }
      body > main { padding-top: 120px !important; }
    </style>
  </head>
  <body>
    <header class="setup-preview-toolbar">
      <span><strong>UI preview</strong> · No downloads or service changes</span>
      <nav aria-label="Preview scenarios">
        <a href="?preview&state=missing">Not installed</a>
        <a href="?preview&state=installed">Not running</a>
        <a href="?preview&outcome=error">Install failure</a>
        <a href="?preview&theme=light">Light theme</a>
        <a href="?preview">Reset</a>
      </nav>
    </header>
    <script type="module">
      if (import.meta.env.DEV) {
        const url = new URL(location.href);
        url.searchParams.set("preview", "");
        history.replaceState(null, "", url);
        await import("/src/components/HerdrSetupCard.browser.tsx");
      } else {
        document.body.textContent = "This preview is only available in the development server.";
      }
    </script>
  </body>
</html>
