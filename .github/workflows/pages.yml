name: Deploy Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        permissions:
            contents: read
            pages: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: "1.4.1"
                  no-cache: true
            - name: Verify live Roamgate installer
              run: |
                  set -eu
                  status=$(curl --fail --silent --show-error --location \
                    --proto '=https' --proto-redir '=https' \
                    --connect-timeout 10 --max-time 60 --output /dev/null \
                    --write-out '%{http_code}' \
                    https://github.com/powerfooI/roamgate/releases/latest/download/install-roamgate.sh) \
                    && [ "$status" = 200 ] \
                    || { echo 'Publish a Roamgate release as Latest before deploying Pages.' >&2; exit 1; }
            - name: Configure Pages
              uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
              with:
                  enablement: true
            - name: Test tutorial rendering and site references
              run: bun test scripts/pages-content.test.ts scripts/pages-workflow.test.ts
            - name: Build landing page and tutorial
              run: bun run build:site
            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
              with:
                  path: .pages-dist

    deploy:
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
