name: Publish Release

# Run this after the matching Prepare Release PR has merged. The matching
# release commit on main is tagged, then Release is dispatched on that tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (X.Y.Z)
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Tag and start release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"
          no-cache: true
      - id: tag
        name: Verify metadata and create tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: version must be in X.Y.Z form" >&2
            exit 1
          fi

          read_version_at() {
            git show "$1:$2" \
              | bun -e 'console.log(JSON.parse(await Bun.stdin.text()).version)'
          }

          # Find the first-parent commit that changed the top-level package
          # version to VERSION, not the later commit that changed away from it.
          release_sha=""
          while read -r candidate_sha; do
            if [ "$(read_version_at "$candidate_sha" package.json)" != "$VERSION" ]; then
              continue
            fi
            parent_sha="$(git rev-parse "${candidate_sha}^1" 2>/dev/null || true)"
            if [ -z "$parent_sha" ] || \
              [ "$(read_version_at "$parent_sha" package.json)" != "$VERSION" ]; then
              release_sha="$candidate_sha"
              break
            fi
          done < <(git rev-list --first-parent origin/main -- package.json)

          if [ -z "$release_sha" ]; then
            echo "error: no release commit for $VERSION exists on main" >&2
            exit 1
          fi

          read_version() {
            read_version_at "$release_sha" "$1"
          }
          test "$(read_version package.json)" = "$VERSION"
          test "$(read_version web/package.json)" = "$VERSION"
          test "$(read_version server/package.json)" = "$VERSION"

          tag="v$VERSION"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            test "$(git cat-file -t "refs/tags/$tag")" = "tag"
            test "$(git rev-list -n 1 "$tag")" = "$release_sha"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Roamgate $VERSION" "$release_sha"
            gh auth setup-git
            git push origin "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Start Release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published; nothing to dispatch."
            exit 0
          fi
          gh workflow run "Release" --ref "$TAG"
