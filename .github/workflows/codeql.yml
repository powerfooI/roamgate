name: CodeQL

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    schedule:
        - cron: "23 4 * * 1"
    workflow_dispatch:

permissions: {}

concurrency:
    group: codeql-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                language: [javascript-typescript, actions]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            # Neither language needs a build or dependency installation. Keep
            # untrusted PR code out of executable steps in this upload job.
            - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none
            # The default query suite is used for both languages.
            - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
              with:
                  category: "/language:${{ matrix.language }}"
