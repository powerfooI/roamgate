name: Release

on:
  push:
    tags: ["v*"]
  # Allows the Publish Release workflow (or a maintainer) to dispatch a run
  # on an existing tag ref.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Verify release metadata
        shell: bash
        run: |
          package_version="$(bun -e 'console.log(require("./package.json").version)')"
          web_version="$(bun -e 'console.log(require("./web/package.json").version)')"
          server_version="$(bun -e 'console.log(require("./server/package.json").version)')"

          [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v$package_version"
          test "$web_version" = "$package_version"
          test "$server_version" = "$package_version"
          escaped_version="${package_version//./\\.}"
          grep -Eq "^## ${escaped_version} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: bun run precommit

  package:
    name: Package ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
          - windows-x64
          - windows-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Build release package
        run: bun run package:${{ matrix.platform }}
      - name: Verify release package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          platform="${{ matrix.platform }}"
          package_dir="roamgate-$platform"
          versioned_archive="roamgate-v$version-$platform.tar.xz"
          latest_archive="roamgate-$platform.tar.xz"

          for archive in "$versioned_archive" "$latest_archive"; do
            test -f "dist/$archive"
            test -f "dist/$archive.sha256"
            if command -v sha256sum >/dev/null 2>&1; then
              (cd dist && sha256sum -c "$archive.sha256")
            else
              (cd dist && shasum -a 256 -c "$archive.sha256")
            fi
          done

          manifest="dist/roamgate-$platform.update.json"
          test -f "$manifest"
          if command -v sha256sum >/dev/null 2>&1; then
            archive_digest="$(sha256sum "dist/$latest_archive" | awk '{ print $1 }')"
          else
            archive_digest="$(shasum -a 256 "dist/$latest_archive" | awk '{ print $1 }')"
          fi
          expected_manifest="{\"schema\":1,\"name\":\"roamgate\",\"version\":\"$version\",\"platform\":\"$platform\",\"archive\":\"$latest_archive\",\"sha256\":\"$archive_digest\"}"
          grep -Fx "$expected_manifest" "$manifest"

          extract_dir="$RUNNER_TEMP/roamgate-release"
          mkdir -p "$extract_dir"
          tar -xJf "dist/$versioned_archive" -C "$extract_dir"
          grep -Fx "roamgate $version $platform" "$extract_dir/$package_dir/VERSION"
          binary_name="roamgate"
          case "$platform" in
            windows-*) binary_name="roamgate.exe" ;;
          esac
          binary="$extract_dir/$package_dir/$binary_name"
          case "$platform" in
            linux-x64)
              test "$("$binary" --version)" = "roamgate $version"
              ;;
            linux-arm64)
              file "$binary" | grep -Eq 'ELF 64-bit.*ARM aarch64'
              ;;
            darwin-x64)
              file "$binary" | grep -Eq 'Mach-O 64-bit.*x86_64'
              ;;
            darwin-arm64)
              file "$binary" | grep -Eq 'Mach-O 64-bit.*arm64'
              ;;
            windows-x64)
              file "$binary" | grep -Eq 'PE32\+ executable.*x86-64.*MS Windows'
              ;;
            windows-arm64)
              file "$binary" | grep -Eq 'PE32\+ executable.*Aarch64.*MS Windows'
              ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: roamgate-${{ matrix.platform }}
          path: |
            dist/roamgate-*.tar.xz*
            dist/roamgate-*.update.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: roamgate-*
          merge-multiple: true
      - name: Reject missing assets and legacy update aliases
        run: node scripts/check-release-assets.mjs "${GITHUB_REF_NAME#v}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/roamgate-*.tar.xz
          dist/roamgate-*.tar.xz.sha256
          dist/roamgate-*.update.json
          scripts/install-roamgate.sh
          --verify-tag
          --latest
          --generate-notes
          --title "Roamgate $GITHUB_REF_NAME"
